<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DJ Wala">
  <!-- A record on the deck: night-coloured ground, magenta label, one
       highlight sweeping across the grooves. Reads at 16px because it is
       three shapes and nothing else. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#ff2e93" />
      <stop offset="100%" stop-color="#c41f70" />
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".55" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#22e1ff" stop-opacity=".35" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#08060f" />
  <circle cx="32" cy="32" r="23" fill="#15101f" />
  <circle cx="32" cy="32" r="23" fill="url(#sheen)" />

  <!-- grooves -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".16">
    <circle cx="32" cy="32" r="19" />
    <circle cx="32" cy="32" r="15.5" />
    <circle cx="32" cy="32" r="12" />
  </g>

  <circle cx="32" cy="32" r="8.5" fill="url(#glow)" />
  <circle cx="32" cy="32" r="2.2" fill="#08060f" />
</svg>
