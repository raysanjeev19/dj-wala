<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Maskable: Android crops this to a circle, a squircle or a rounded
       square depending on the launcher, and only the middle 80% is
       guaranteed to survive. So the record is drawn at 0.62 of the tile
       and the ground colour runs edge to edge. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#ff2e93"/><stop offset="100%" stop-color="#c41f70"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="45%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#22e1ff" stop-opacity=".35"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="#08060f"/>
  <circle cx="32" cy="32" r="18" fill="#15101f"/>
  <circle cx="32" cy="32" r="18" fill="url(#sheen)"/>
  <g fill="none" stroke="#fff" stroke-opacity=".16">
    <circle cx="32" cy="32" r="14.5"/><circle cx="32" cy="32" r="11.5"/><circle cx="32" cy="32" r="8.8"/>
  </g>
  <circle cx="32" cy="32" r="6.5" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="1.7" fill="#08060f"/>
</svg>
